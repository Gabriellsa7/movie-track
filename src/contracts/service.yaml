openapi: 3.0.2
info:
  title: Movie Track API
  description: >
    Log the movies you have watched (rating, review, favorites and poster), keep a watchlist
    and search TMDB to prefill both. Every /movies, /watchlist and /tmdb route needs the access
    token from POST /auth/login: click Authorize and paste it.
  version: 1.0.0

servers:
  - url: /
    description: This server

tags:
  - name: Users
    description: User management operations
  - name: Auth
    description: Authentication with JWT access and refresh tokens
  - name: Movies
    description: The authenticated user's watched movies
  - name: Genres
    description: The fixed list of movie genres
  - name: Watchlist
    description: Movies the authenticated user wants to watch
  - name: Movie search
    description: Search movies in TMDB to prefill a movie or a watchlist item

paths:
  /users:
    get:
      tags:
        - Users
      summary: List users
      operationId: getUsers
      description: Public, paginated list of users sorted by name. The search matches the name ignoring case and accents. Never returns e-mails.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          description: Part of the user's name or nickname
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Maximum number of users per page
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      description: Create an account. Moves to POST /auth/signup when authentication is added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: A user with this email already exists (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'A user with this email already exists'
                status: 409
                code: 'EMAIL_TAKEN'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Get a public user profile
      operationId: getUserProfile
      description: Public profile of a user. Never returns the e-mail.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags:
        - Users
      summary: Update a user
      operationId: updateUser
      description: Update the name or e-mail of an existing user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: A user with this email already exists (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      description: Delete an account and everything in it (its movies, watchlist items, uploaded posters and avatar). The current password is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUser'
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - Users
      summary: Change a user's password
      operationId: changePassword
      description: Replace the password after checking the current one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      operationId: login
      description: Exchange valid credentials for an access token and a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh the tokens
      operationId: refreshTokens
      description: Exchange a valid refresh token for a new access token and a new refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /movies:
    post:
      tags:
        - Movies
      summary: Log a watched movie
      operationId: createMovie
      description: >
        Adds a movie to the authenticated user's list. Sending watchlistItemId moves that
        watchlist item to the list (the item is removed).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMovie'
      responses:
        '201':
          description: Movie logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WatchlistItemNotFound'
        '409':
          $ref: '#/components/responses/MovieAlreadyLogged'
        '422':
          $ref: '#/components/responses/InvalidMovie'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    get:
      tags:
        - Movies
      summary: List my movies
      operationId: getMovies
      description: Paginated list of the authenticated user's movies, with search, filters and sorting.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Part of the title, ignoring case and accents
        - name: genreId
          in: query
          required: false
          schema:
            type: string
          description: Only movies with this genre (must exist, else INVALID_GENRE)
        - name: minRating
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RatingFilter'
        - name: maxRating
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RatingFilter'
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
          description: true returns only favorites
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [watchedAt, rating, title, releaseYear]
            default: watchedAt
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: A page of movies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Unknown genre (INVALID_GENRE) or minRating greater than maxRating (INVALID_RATING_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /movies/{id}:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - Movies
      summary: Get one of my movies
      operationId: getMovie
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags:
        - Movies
      summary: Update one of my movies
      operationId: updateMovie
      description: >
        Replaces the movie data. Optional fields that are not sent keep their value; send an
        empty string to clear review or director. posterUrl sets an external poster
        (deleting an uploaded one) and null removes the poster.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovie'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '409':
          $ref: '#/components/responses/MovieAlreadyLogged'
        '422':
          $ref: '#/components/responses/InvalidMovie'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Movies
      summary: Delete one of my movies
      operationId: deleteMovie
      description: Hard delete; also deletes its uploaded poster.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Movie deleted
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /movies/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    patch:
      tags:
        - Movies
      summary: Mark or unmark one of my movies as favorite
      operationId: setMovieFavorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieFavorite'
      responses:
        '200':
          description: Favorite flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /movies/{id}/poster:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    put:
      tags:
        - Movies
      summary: Upload the poster of one of my movies
      operationId: uploadMoviePoster
      description: >
        Stores the image in Cloudinary and sets it as the poster, replacing (and deleting)
        any previous uploaded poster. JPEG, PNG or WebP, up to 5 MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PosterUpload'
      responses:
        '200':
          description: Poster uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '422':
          $ref: '#/components/responses/InvalidPoster'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Movies
      summary: Remove the poster of one of my movies
      operationId: removeMoviePoster
      description: Clears the poster and deletes the uploaded file. A no-op when there is no poster.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Poster removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /watchlist:
    post:
      tags:
        - Watchlist
      summary: Add a movie to my watchlist
      operationId: addWatchlistItem
      description: >
        Saves a movie to watch later. To log it once watched, send its id as watchlistItemId
        in POST /movies, which removes it from the watchlist.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWatchlistItem'
      responses:
        '201':
          description: Movie added to the watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            The same movie (same tmdbId, or same title and release year) is already in your
            watchlist (ALREADY_IN_WATCHLIST) or in your list of watched movies (MOVIE_ALREADY_LOGGED).
            Without a release year, only tmdbId identifies a watched movie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This movie is already in your watchlist'
                status: 409
                code: 'ALREADY_IN_WATCHLIST'
        '422':
          description: releaseYear is after next year (INVALID_RELEASE_YEAR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    get:
      tags:
        - Watchlist
      summary: List my watchlist
      operationId: getWatchlist
      description: Paginated list of the authenticated user's watchlist, most recently added first.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Part of the title, ignoring case and accents
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: A page of watchlist items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /watchlist/{id}:
    parameters:
      - $ref: '#/components/parameters/WatchlistItemId'
    delete:
      tags:
        - Watchlist
      summary: Remove a movie from my watchlist
      operationId: removeWatchlistItem
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Movie removed from the watchlist
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WatchlistItemNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /tmdb/search:
    get:
      tags:
        - Movie search
      summary: Search movies in TMDB
      operationId: searchTmdbMovies
      description: >
        Searches TMDB by title (pt-BR). Each result has what POST /movies and POST /watchlist
        need: tmdbId, title, releaseYear, synopsis, posterUrl and genreIds (already translated
        to the ids of GET /genres). TMDB pages always hold up to 20 results.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '\S'
          description: The movie title, or part of it
          example: 'cidade de deus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 1
      responses:
        '200':
          description: A page of TMDB results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieSearchPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          description: TMDB did not answer or rejected the request (MOVIE_CATALOG_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Movie catalog unavailable'
                status: 503
                code: 'MOVIE_CATALOG_UNAVAILABLE'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /genres:
    get:
      tags:
        - Genres
      summary: List the genres
      operationId: listGenres
      description: Public. The fixed pt-BR list seeded from TMDB, sorted by name. Movies reference these ids in genreIds.
      responses:
        '200':
          description: Every genre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: The ID of the user
    MovieId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: The ID of the movie entry
    WatchlistItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: The ID of the watchlist item
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from POST /auth/login, sent as `Authorization: Bearer <token>`'

  responses:
    ValidationFailed:
      description: Invalid request (VALIDATION_ERROR, INVALID_JSON)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MovieNotFound:
      description: The movie does not exist or is not yours (MOVIE_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Movie not found'
            status: 404
            code: 'MOVIE_NOT_FOUND'
    WatchlistItemNotFound:
      description: The watchlist item does not exist or is not yours (WATCHLIST_ITEM_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Watchlist item not found'
            status: 404
            code: 'WATCHLIST_ITEM_NOT_FOUND'
    MovieAlreadyLogged:
      description: The same movie (same tmdbId, or same title and release year) is already in your list (MOVIE_ALREADY_LOGGED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'This movie is already in your list'
            status: 409
            code: 'MOVIE_ALREADY_LOGGED'
    InvalidMovie:
      description: >
        A business rule failed: INVALID_RATING (1 to 10 in steps of 0.5), INVALID_GENRE
        (1 to 5 genres from the list), INVALID_RELEASE_YEAR (after next year) or
        INVALID_WATCHED_AT (in the future)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'rating must be between 1 and 10 in steps of 0.5'
            status: 422
            code: 'INVALID_RATING'
    InvalidPoster:
      description: The file is not a JPEG, PNG or WebP image (INVALID_POSTER_TYPE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'poster must be a JPEG, PNG or WebP image'
            status: 422
            code: 'INVALID_POSTER_TYPE'
    UnexpectedError:
      description: >
        Any other error, in the same shape: 405 METHOD_NOT_ALLOWED, 413 PAYLOAD_TOO_LARGE,
        415 UNSUPPORTED_MEDIA_TYPE, 503 SERVICE_UNAVAILABLE (database down) or
        500 INTERNAL_ERROR (unexpected, logged with the trace id)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Service temporarily unavailable'
            status: 503
            code: 'SERVICE_UNAVAILABLE'
    Unauthorized:
      description: Missing, invalid or expired token (INVALID_TOKEN, TOKEN_EXPIRED), or wrong current password (INVALID_CREDENTIALS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Token expired'
            status: 401
            code: 'TOKEN_EXPIRED'
    UserNotFound:
      description: User not found (USER_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'User not found'
            status: 404
            code: 'USER_NOT_FOUND'
    Forbidden:
      description: The authenticated user cannot act on this resource (FORBIDDEN_RESOURCE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'You can only change your own account'
            status: 403
            code: 'FORBIDDEN_RESOURCE'

    InvalidCredentials:
      description: The password does not match (INVALID_CREDENTIALS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Invalid credentials'
            status: 401
            code: 'INVALID_CREDENTIALS'
    InvalidToken:
      description: The token is missing, invalid or expired (INVALID_TOKEN, TOKEN_EXPIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Token expired'
            status: 401
            code: 'TOKEN_EXPIRED'

  schemas:
    Genre:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The id to send in genreIds
        name:
          type: string
          example: 'Drama'
    NewMovie:
      type: object
      additionalProperties: false
      required:
        - title
        - synopsis
        - releaseYear
        - genreIds
        - rating
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          example: 'Cidade de Deus'
        synopsis:
          type: string
          maxLength: 2000
        releaseYear:
          type: integer
          minimum: 1888
          description: Up to next year (else INVALID_RELEASE_YEAR)
          example: 2002
        genreIds:
          type: array
          description: 1 to 5 ids from GET /genres (else INVALID_GENRE)
          items:
            type: string
        rating:
          type: number
          description: 1 to 10 in steps of 0.5 (else INVALID_RATING)
          example: 9.5
        review:
          type: string
          maxLength: 5000
        director:
          type: string
          maxLength: 200
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1000
        watchedAt:
          type: string
          format: date
          description: Defaults to today; cannot be in the future (else INVALID_WATCHED_AT)
        isFavorite:
          type: boolean
          default: false
        tmdbId:
          type: integer
          minimum: 1
        posterUrl:
          type: string
          maxLength: 2048
          pattern: '^https?://'
          description: An external poster URL
        watchlistItemId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The watchlist item being moved to the list (it is removed)
    UpdateMovie:
      type: object
      additionalProperties: false
      required:
        - title
        - synopsis
        - releaseYear
        - genreIds
        - rating
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          example: 'Cidade de Deus'
        synopsis:
          type: string
          maxLength: 2000
        releaseYear:
          type: integer
          minimum: 1888
          description: Up to next year (else INVALID_RELEASE_YEAR)
          example: 2002
        genreIds:
          type: array
          description: 1 to 5 ids from GET /genres (else INVALID_GENRE)
          items:
            type: string
        rating:
          type: number
          description: 1 to 10 in steps of 0.5 (else INVALID_RATING)
          example: 9.5
        review:
          type: string
          maxLength: 5000
        director:
          type: string
          maxLength: 200
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1000
        watchedAt:
          type: string
          format: date
          description: Defaults to today; cannot be in the future (else INVALID_WATCHED_AT)
        isFavorite:
          type: boolean
          default: false
        tmdbId:
          type: integer
          minimum: 1
        posterUrl:
          type: string
          nullable: true
          maxLength: 2048
          pattern: '^https?://'
          description: An external poster URL; null removes the poster
    PosterUpload:
      type: object
      additionalProperties: false
      required:
        - poster
      properties:
        poster:
          type: string
          format: binary
          description: The image file (JPEG, PNG or WebP, up to 5 MB)
    MovieFavorite:
      type: object
      additionalProperties: false
      required:
        - isFavorite
      properties:
        isFavorite:
          type: boolean
    RatingFilter:
      type: number
      minimum: 1
      maximum: 10
      multipleOf: 0.5
    Movie:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - title
        - synopsis
        - releaseYear
        - genreIds
        - rating
        - watchedAt
        - isFavorite
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        userId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        tmdbId:
          type: integer
        title:
          type: string
        synopsis:
          type: string
        posterUrl:
          type: string
        releaseYear:
          type: integer
        genreIds:
          type: array
          items:
            type: string
        director:
          type: string
        durationMinutes:
          type: integer
        rating:
          type: number
        review:
          type: string
        watchedAt:
          type: string
          format: date-time
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MoviePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
    NewWatchlistItem:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          example: 'O Auto da Compadecida'
        releaseYear:
          type: integer
          minimum: 1888
          description: Up to next year (else INVALID_RELEASE_YEAR)
          example: 2000
        tmdbId:
          type: integer
          minimum: 1
        posterUrl:
          type: string
          maxLength: 2048
          pattern: '^https?://'
          description: An external poster URL
    WatchlistItem:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - title
        - addedAt
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        userId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        tmdbId:
          type: integer
        title:
          type: string
        posterUrl:
          type: string
        releaseYear:
          type: integer
        addedAt:
          type: string
          format: date-time
    WatchlistPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistItem'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
    MovieSearchResult:
      type: object
      additionalProperties: false
      required:
        - tmdbId
        - title
        - originalTitle
        - genreIds
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        originalTitle:
          type: string
        synopsis:
          type: string
        releaseYear:
          type: integer
        posterUrl:
          type: string
        genreIds:
          type: array
          items:
            type: string
          description: Ids from GET /genres; TMDB genres outside that list are left out
    MovieSearchPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MovieSearchResult'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - moviesCount
        - averageRating
        - favoritesCount
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
        moviesCount:
          type: integer
          minimum: 0
          description: How many movies the user has logged
        averageRating:
          type: number
          nullable: true
          description: Average rating of the user's movies, rounded to one decimal; null without movies
        favoritesCount:
          type: integer
          minimum: 0
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - moviesCount
        - averageRating
        - favoritesCount
        - memberSince
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
        memberSince:
          type: string
          format: date-time
          description: When the user signed up
        moviesCount:
          type: integer
          minimum: 0
          description: How many movies the user has logged
        averageRating:
          type: number
          nullable: true
          description: Average rating of the user's movies, rounded to one decimal; null without movies
        favoritesCount:
          type: integer
          minimum: 0
    UserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        total:
          type: integer
          minimum: 0
          description: Number of users matching the search
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        email:
          type: string
          format: email
          description: The user's email address (lowercase)
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
        createdAt:
          type: string
          format: date-time
          description: The date and time the user was created
        updatedAt:
          type: string
          format: date-time
          description: The date and time the user was last updated
    NewUser:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '\S'
          description: The user's name or nickname (not unique)
          example: 'Whitebeard'
        email:
          type: string
          format: email
          maxLength: 254
          description: The user's email address
          example: 'whitebeard@email.com'
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
          description: Plain-text password with at least one letter and one number; stored only as a hash
          example: 'secret123'
    ChangePassword:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: The current password
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
          description: New password with at least one letter and one number
    DeleteUser:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: The current password, to confirm the deletion
    UpdateUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '\S'
          description: The user's name or nickname
        email:
          type: string
          format: email
          maxLength: 254
          description: The user's email address
    Error:
      type: object
      required:
        - message
        - status
        - code
      properties:
        message:
          type: string
          description: Human-readable error message
          example: 'User not found'
        status:
          type: integer
          description: HTTP status code (same as the response status)
          example: 404
        code:
          type: string
          description: >
            Machine-readable error code. Domain codes (USER_NOT_FOUND, EMAIL_TAKEN,
            INVALID_CREDENTIALS, INVALID_TOKEN, TOKEN_EXPIRED, FORBIDDEN_RESOURCE,
            MOVIE_NOT_FOUND, MOVIE_ALREADY_LOGGED, WATCHLIST_ITEM_NOT_FOUND, INVALID_RATING,
            INVALID_RATING_RANGE, INVALID_GENRE, INVALID_RELEASE_YEAR, INVALID_WATCHED_AT) or
            generic ones: VALIDATION_ERROR, INVALID_JSON, BAD_REQUEST, UNAUTHORIZED,
            FORBIDDEN, NOT_FOUND, ROUTE_NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
            DUPLICATE_KEY, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, REQUEST_ABORTED,
            SERVICE_UNAVAILABLE, INTERNAL_ERROR
          example: 'USER_NOT_FOUND'
        errors:
          type: array
          description: Per-field details, present on validation errors
          items:
            $ref: '#/components/schemas/FieldError'
    ValidationError:
      type: object
      required:
        - message
        - status
        - code
      properties:
        message:
          type: string
          description: General validation error message
          example: 'Validation failed'
        status:
          type: integer
          description: HTTP status code
          example: 400
        code:
          type: string
          description: VALIDATION_ERROR for an invalid field, INVALID_JSON for a malformed body
          example: 'VALIDATION_ERROR'
        errors:
          type: array
          description: List of specific validation errors
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: The field that failed validation
          example: 'email'
        message:
          type: string
          description: The validation error message
          example: 'should match format "email"'
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: 'whitebeard@email.com'
        password:
          type: string
          minLength: 1
          maxLength: 72
          example: 'secret123'
    RefreshToken:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: The refresh token received from login or from a previous refresh
    AuthTokens:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT sent as `Authorization: Bearer <token>`'
        refreshToken:
          type: string
          description: 'Long-lived JWT used only on POST /auth/refresh'
