openapi: 3.0.2
info:
  title: Example API
  description: This is a sample API to demonstrate OpenAPI specification.
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server
  - url: http://localhost

tags:
  - name: Users
    description: User management operations
  - name: Auth
    description: Authentication with JWT access and refresh tokens

paths:
  /users:
    get:
      tags:
        - Users
      summary: List users
      operationId: getUsers
      description: Public, paginated list of users sorted by name. The search matches the name ignoring case and accents. Never returns e-mails.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          description: Part of the user's name or nickname
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Maximum number of users per page
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      description: Create an account. Moves to POST /auth/signup when authentication is added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: A user with this email already exists (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'A user with this email already exists'
                status: 409
                code: 'EMAIL_TAKEN'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Get a public user profile
      operationId: getUserProfile
      description: Public profile of a user. Never returns the e-mail.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update a user
      operationId: updateUser
      description: Update the name or e-mail of an existing user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: A user with this email already exists (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      description: Delete an account. The current password is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUser'
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - Users
      summary: Change a user's password
      operationId: changePassword
      description: Replace the password after checking the current one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      operationId: login
      description: Exchange valid credentials for an access token and a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh the tokens
      operationId: refreshTokens
      description: Exchange a valid refresh token for a new access token and a new refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the user
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from POST /auth/login, sent as `Authorization: Bearer <token>`'

  responses:
    Unauthorized:
      description: Missing, invalid or expired token (INVALID_TOKEN, TOKEN_EXPIRED), or wrong current password (INVALID_CREDENTIALS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Token expired'
            status: 401
            code: 'TOKEN_EXPIRED'
    UserNotFound:
      description: User not found (USER_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'User not found'
            status: 404
            code: 'USER_NOT_FOUND'
    InvalidCredentials:
      description: The password does not match (INVALID_CREDENTIALS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Invalid credentials'
            status: 401
            code: 'INVALID_CREDENTIALS'
    InvalidToken:
      description: The token is missing, invalid or expired (INVALID_TOKEN, TOKEN_EXPIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Token expired'
            status: 401
            code: 'TOKEN_EXPIRED'

  schemas:
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - memberSince
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
        memberSince:
          type: string
          format: date-time
          description: When the user signed up
    UserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        total:
          type: integer
          minimum: 0
          description: Number of users matching the search
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name or nickname
        email:
          type: string
          format: email
          description: The user's email address (lowercase)
        avatarUrl:
          type: string
          format: uri
          description: The URL of the user's avatar
        createdAt:
          type: string
          format: date-time
          description: The date and time the user was created
        updatedAt:
          type: string
          format: date-time
          description: The date and time the user was last updated
    NewUser:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '\S'
          description: The user's name or nickname (not unique)
          example: 'Whitebeard'
        email:
          type: string
          format: email
          maxLength: 254
          description: The user's email address
          example: 'whitebeard@email.com'
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
          description: Plain-text password with at least one letter and one number; stored only as a hash
          example: 'secret123'
    ChangePassword:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: The current password
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
          description: New password with at least one letter and one number
    DeleteUser:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: The current password, to confirm the deletion
    UpdateUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '\S'
          description: The user's name or nickname
        email:
          type: string
          format: email
          maxLength: 254
          description: The user's email address
    Error:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Error message describing what went wrong
          example: 'User not found'
        status:
          type: integer
          description: HTTP status code
          example: 404
        code:
          type: string
          description: Machine-readable error code
          example: 'USER_NOT_FOUND'
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/users/123'
    ValidationError:
      type: object
      required:
        - message
        - status
        - errors
      properties:
        message:
          type: string
          description: General validation error message
          example: 'Validation failed'
        status:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/users'
        errors:
          type: array
          description: List of specific validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
                example: 'email'
              message:
                type: string
                description: The validation error message
                example: 'Email is required'
              value:
                type: string
                description: The invalid value provided
                example: ''
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: 'whitebeard@email.com'
        password:
          type: string
          minLength: 1
          maxLength: 72
          example: 'secret123'
    RefreshToken:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: The refresh token received from login or from a previous refresh
    AuthTokens:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT sent as `Authorization: Bearer <token>`'
        refreshToken:
          type: string
          description: 'Long-lived JWT used only on POST /auth/refresh'
